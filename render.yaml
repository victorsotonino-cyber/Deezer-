services:
  - type: web
    name: datashop-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: datashop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: BOT_NAME
        value: DATASHOP
      - key: PREFIX
        value: "!"
      - key: EMBED_COLOR
        value: "7C3AED"
      - key: DB_PATH
        value: /var/data/datashop.sqlite
